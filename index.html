<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feedback</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- AI Assistant Button -->
    <button id="ai-btn" class="ai-button">💬 AI Assistant</button>

    <div id="container">
      <main>
        <h2>Feedback Form</h2>
        <h3>Love something? Hate something? Let us know!</h3>
        Note: Fields marked with an asterisk(*) are mandatory
        <br /><br />

        <form id="feedback-form" novalidate>
          <!-- Title (radio) -->
          <label>Title*:</label>
          <input type="radio" name="title" value="Miss" /> Miss
          <input type="radio" name="title" value="Mr" /> Mr.
          <input type="radio" name="title" value="Mrs" /> Mrs.
          <br /><br />

          <!-- First Name -->
          <label for="firstName">First Name*:</label>
          <input type="text" id="firstName" placeholder="First Name" />
          <br /><br />

          <!-- Last Name -->
          <label for="lastName">Last Name*:</label>
          <input type="text" id="lastName" placeholder="Last Name" />
          <br /><br />

          <!-- Email -->
          <label for="emailId">Email Id*:</label>
          <input
            type="text"
            id="emailId"
            placeholder="yourname@northeastern.edu"
          />
          <br /><br />

          <!-- Phone Number -->
          <label for="phoneNumber">Phone Number*:</label>
          <input type="text" id="phoneNumber" placeholder="(XXX) XXX-XXXX" />
          <br /><br />

          <!-- Zip Code -->
          <label for="zipcode">Zip Code*:</label>
          <input type="text" id="zipcode" placeholder="5 digits" />
          <br /><br />

          <!-- Address 2 (Optional) -->
          <label for="address2">Street Address 2:</label>
          <input type="text" id="address2" maxlength="20" />
          <div id="address2-count">0/20 characters used</div>
          <br /><br />

          <!-- How did you hear? -->
          <label for="source">How did you hear*:</label>
          <div id="source-group" style="display: inline-block">
            <input type="checkbox" name="source" value="facebook" /> Facebook
            <input type="checkbox" name="source" value="google" /> Google
            <input type="checkbox" name="source" value="yelp" /> Yelp
          </div>
          <br /><br />

          <!-- Drinks Select + Dynamic Checkbox -->
          <label for="drink">Drinks*:</label>
          <select id="drink">
            <option value="">--Select--</option>
            <option value="tea">Hot Black Tea - Keemun</option>
            <option value="coffee">Coffee</option>
            <option value="juice">Juice</option>
            <option value="water">Water</option>
            <option value="milk">Milk</option>
          </select>
          <div id="drink-options"></div>
          <br /><br />

          <!-- Comments -->
          <label for="comments">Comments*:</label>
          <textarea
            id="comments"
            rows="5"
            cols="25"
            placeholder="Your comments"
          ></textarea>
          <br /><br />

          <input type="submit" value="Submit" disabled />
          <input type="reset" value="Reset" />
          <br /><br />
        </form>
      </main>
    </div>

    <!-- Chat Window -->
    <div id="chat-window">
      <div id="chat-header">
        <strong>AI Assistant</strong>
        <button id="chat-close">✕</button>
      </div>
      <div id="chat-messages"></div>
      <div class="chat-input-container">
        <input type="text" id="chat-input" placeholder="Ask a question..." />
        <button id="chat-send">Send</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
