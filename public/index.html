<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .students-list {
            margin-top: 30px;
        }
        .student-card {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .student-info h3 {
            color: #333;
            margin-bottom: 5px;
        }
        .student-info p {
            color: #666;
            font-size: 14px;
        }
        .student-actions button {
            margin-left: 10px;
            padding: 8px 15px;
            font-size: 14px;
        }
        .delete-btn {
            background: #e74c3c;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Student Management System</h1>
        
        <div id="message" class="message"></div>
        
        <div class="form-section">
            <h2>Add New Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="16" max="100" required>
                </div>
                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Information Systems">Information Systems</option>
                    </select>
                </div>
                <button type="submit">Add Student</button>
            </form>
        </div>

        <div class="students-list">
            <h2>Student List</h2>
            <div id="studentsList"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api/students';
        const form = document.getElementById('studentForm');
        const studentsList = document.getElementById('studentsList');
        const messageDiv = document.getElementById('message');

        // Show message to user
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Fetch and display all students
        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                const students = await response.json();
                
                if (students.length === 0) {
                    studentsList.innerHTML = '<p style="text-align:center;color:#999;">No students yet. Add your first student!</p>';
                    return;
                }
                
                studentsList.innerHTML = students.map(student => `
                    <div class="student-card">
                        <div class="student-info">
                            <h3>${student.name}</h3>
                            <p>📧 ${student.email} | 🎂 ${student.age} years | 📚 ${student.course}</p>
                            <p style="font-size:12px;color:#999;">Enrolled: ${new Date(student.enrolledDate).toLocaleDateString()}</p>
                        </div>
                        <div class="student-actions">
                            <button class="delete-btn" onclick="deleteStudent('${student._id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showMessage('Error loading students', 'error');
            }
        }

        // Add new student
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                age: parseInt(document.getElementById('age').value),
                course: document.getElementById('course').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    showMessage('Student added successfully!', 'success');
                    form.reset();
                    loadStudents();
                } else {
                    const error = await response.json();
                    showMessage(error.error, 'error');
                }
            } catch (error) {
                showMessage('Error adding student', 'error');
            }
        });

        // Delete student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Student deleted successfully!', 'success');
                    loadStudents();
                } else {
                    showMessage('Error deleting student', 'error');
                }
            } catch (error) {
                showMessage('Error deleting student', 'error');
            }
        }

        // Load students on page load
        loadStudents();
    </script>
</body>
</html>
