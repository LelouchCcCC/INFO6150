<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Calculator App</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>User Login</h2>
        <div id="login-success-msg" class="success-message">
          Login successful! Redirecting...
        </div>
        <div id="login-error-msg" class="error-message"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="user@northeastern.edu"
            />
            <div id="email-error" class="error-message"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Minimum 8 characters"
            />
            <div id="password-error" class="error-message"></div>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="remember-me" /> Remember Me
            </label>
          </div>

          <button type="submit" id="login-btn" class="btn-primary" disabled>
            Login
          </button>
        </form>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
